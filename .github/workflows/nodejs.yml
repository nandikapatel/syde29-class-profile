name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js version from .nvmrc or fallback to 16.x
      uses: actions/setup-node@v3
      with:
        node-version-file: .nvmrc
        node-version: 16.x
    - run: node --version
    - run: npm install
    - run: npm run build